name = "yftach-projects"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Cloudflare R2 bucket binding for receipts and project files
[[r2_buckets]]
binding = "GAVSTACK_FILES"
bucket_name = "gavstack-files"

[vars]
ENVIRONMENT = "production"

